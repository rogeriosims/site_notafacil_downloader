<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota Fácil - Dashboard de Insights</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="glass-header">
            <div class="logo">
                <h1>Nota Fácil <span>Insights</span></h1>
            </div>
            <div class="controls">
                <div id="file-inputs" class="hidden">
                    <label>
                        Clientes CSV:
                        <input type="file" id="clientes-file" accept=".csv">
                    </label>
                    <label>
                        Consumo CSV:
                        <input type="file" id="consumo-file" accept=".csv">
                    </label>
                </div>
                <button id="reload-btn" class="btn-primary">Atualizar Dados</button>
            </div>
        </header>

        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
            <p>Processando dados...</p>
        </div>

        <main class="dashboard-grid hidden" id="dashboard-content">
            <!-- KPIs -->
            <section class="kpi-cards">
                <div class="card kpi-card">
                    <h3>Total de Clientes</h3>
                    <p class="kpi-value" id="kpi-total-clientes">0</p>
                </div>
                <div class="card kpi-card">
                    <h3>Total de Downloads</h3>
                    <p class="kpi-value" id="kpi-total-downloads">0</p>
                </div>
                <div class="card kpi-card">
                    <h3>Média Downloads/Cliente</h3>
                    <p class="kpi-value" id="kpi-media-downloads">0</p>
                </div>
                <div class="card kpi-card">
                    <h3>Clientes Ativos</h3>
                    <p class="kpi-value" id="kpi-clientes-ativos">0</p>
                </div>
            </section>

            <!-- Charts -->
            <section class="charts-grid">
                <div class="card chart-container">
                    <h3>Downloads (Últimos 30 Dias)</h3>
                    <canvas id="chart-downloads-time"></canvas>
                </div>
                
                <div class="card chart-container">
                    <h3>Downloads por Mês</h3>
                    <canvas id="chart-downloads-mes"></canvas>
                </div>
                
                <div class="card chart-container">
                    <h3>Distribuição por Planos</h3>
                    <canvas id="chart-planos"></canvas>
                </div>

                <div class="card chart-container">
                    <h3>Top 5 Estados (UF)</h3>
                    <canvas id="chart-estados"></canvas>
                </div>

                <div class="card list-container col-span-2">
                    <h3>Top 10 Clientes (Maior Volume)</h3>
                    <div class="table-responsive">
                        <table id="top-clientes-table">
                            <thead>
                                <tr>
                                    <th>Email / Cliente</th>
                                    <th>Downloads</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Inserido via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
